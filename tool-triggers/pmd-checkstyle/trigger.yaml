name: pmd-checkstyle
tools: ["PMD 7.26.0", "Checkstyle"]
analysis_runtime: "Java 17"
targets: ["src/main/java", "src/test/java"]
commands:
  - "pmd check -d src/main/java -R category/java/quickstart.xml -f text"
  - "java -jar checkstyle.jar -c tool-triggers/pmd-checkstyle/checkstyle.xml src/main/java src/test/java"
